name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    name: Test
    uses: ./.github/workflows/ci.yml

  nuget:
    name: Publish NuGet
    # Publishing is irreversible; finish native behavior and bundle checks first.
    needs: [test, native-binaries, runtime-bundles]
    runs-on: ubuntu-latest
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Require publishing credentials
        run: test -n "$NUGET_API_KEY" || { echo 'NUGET_API_KEY is missing; this release cannot publish.'; exit 1; }
      - name: Pack
        run: |
          dotnet pack dotnet/src/Elwood.Core/Elwood.Core.csproj -c Release
          dotnet pack dotnet/src/Elwood.Json/Elwood.Json.csproj -c Release
          dotnet pack dotnet/src/Elwood.Pipeline/Elwood.Pipeline.csproj -c Release
          dotnet pack dotnet/src/Elwood.Pipeline.Azure/Elwood.Pipeline.Azure.csproj -c Release
          dotnet pack dotnet/src/Elwood.Pipeline.Sql/Elwood.Pipeline.Sql.csproj -c Release
          dotnet pack dotnet/src/Elwood.Pipeline.RabbitMq/Elwood.Pipeline.RabbitMq.csproj -c Release
          dotnet pack dotnet/src/Elwood.Pipeline.Redis/Elwood.Pipeline.Redis.csproj -c Release
          dotnet pack dotnet/src/Elwood.Cli/Elwood.Cli.csproj -c Release
          dotnet pack dotnet/src/Elwood.Xlsx/Elwood.Xlsx.csproj -c Release
          dotnet pack dotnet/src/Elwood.Parquet/Elwood.Parquet.csproj -c Release
      - name: Publish Core first
        run: |
          dotnet nuget push dotnet/src/Elwood.Core/bin/Release/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          VERSION=$(dotnet msbuild dotnet/src/Elwood.Core/Elwood.Core.csproj -getProperty:Version)
          for attempt in $(seq 1 120); do
            if curl --fail --silent --output /dev/null "https://api.nuget.org/v3-flatcontainer/elwood.core/$VERSION/elwood.core.$VERSION.nupkg"; then
              echo "Core $VERSION is available from NuGet."
              exit 0
            fi
            sleep 5
          done
          echo 'Core is not available yet; refusing to publish dependent packages.'
          exit 1
      - name: Publish dependent packages
        run: |
          dotnet nuget push dotnet/src/Elwood.Json/bin/Release/*.nupkg            --api-key $NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push dotnet/src/Elwood.Pipeline/bin/Release/*.nupkg        --api-key $NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push dotnet/src/Elwood.Pipeline.Azure/bin/Release/*.nupkg  --api-key $NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push dotnet/src/Elwood.Pipeline.Sql/bin/Release/*.nupkg    --api-key $NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push dotnet/src/Elwood.Pipeline.RabbitMq/bin/Release/*.nupkg --api-key $NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push dotnet/src/Elwood.Pipeline.Redis/bin/Release/*.nupkg  --api-key $NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push dotnet/src/Elwood.Cli/bin/Release/*.nupkg             --api-key $NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push dotnet/src/Elwood.Xlsx/bin/Release/*.nupkg            --api-key $NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push dotnet/src/Elwood.Parquet/bin/Release/*.nupkg         --api-key $NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate

  npm:
    name: Publish npm
    needs: [test, native-binaries, runtime-bundles]
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Install & Build core
        working-directory: ts
        run: |
          npm ci
          npm run build
      - name: Install & Build xlsx
        working-directory: ts-xlsx
        run: |
          npm ci
          npm run build
      - name: Publish core
        if: ${{ env.NPM_TOKEN != '' }}
        working-directory: ts
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already published - skipping"
          else
            npm publish --access public
          fi
      - name: Publish xlsx
        if: ${{ env.NPM_TOKEN != '' }}
        working-directory: ts-xlsx
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already published - skipping"
          else
            npm publish --access public
          fi
      # ts-parquet not published — hyparquet is async-only and Elwood's TS extension API
      # is sync-only. See docs/known-issues.md. Tracked as a follow-up.

  native-binaries:
    name: Native AOT (${{ matrix.os }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            artifact: elwood-linux-x64
            binary: Elwood.Cli
          # macos-latest is arm64; this published artifact targets Intel x64.
          - os: macos-15-intel
            rid: osx-x64
            artifact: elwood-macos-x64
            binary: Elwood.Cli
          - os: windows-latest
            rid: win-x64
            artifact: elwood-win-x64
            binary: Elwood.Cli.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Publish AOT
        run: dotnet publish dotnet/src/Elwood.Cli/Elwood.Cli.csproj -c Release -r ${{ matrix.rid }} -p:PublishAot=true
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify native CLI behavior
        run: node scripts/native-cli-smoke.mjs dotnet/src/Elwood.Cli/bin/Release/net10.0/${{ matrix.rid }}/publish/${{ matrix.binary }}
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: dotnet/src/Elwood.Cli/bin/Release/net10.0/${{ matrix.rid }}/publish/${{ matrix.binary }}

  runtime-bundles:
    name: Runtime and consumer installation kit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Package versioned runtime hosts and tracked installation resources
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/package-runtime.ps1 -Version $env:RELEASE_TAG.TrimStart('v') -OutputDirectory artifacts/runtime
      - uses: actions/upload-artifact@v5
        with:
          name: elwood-runtime-bundles
          path: |
            artifacts/runtime/*.zip
            artifacts/runtime/SHA256SUMS.txt

  github-release:
    name: Create GitHub Release
    needs: [native-binaries, nuget, npm, runtime-bundles]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          cp artifacts/elwood-linux-x64/Elwood.Cli release/elwood-linux-x64
          cp artifacts/elwood-macos-x64/Elwood.Cli release/elwood-macos-x64
          cp artifacts/elwood-win-x64/Elwood.Cli.exe release/elwood-win-x64.exe
          chmod +x release/elwood-linux-x64 release/elwood-macos-x64
          cp artifacts/elwood-runtime-bundles/* release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            release/elwood-linux-x64
            release/elwood-macos-x64
            release/elwood-win-x64.exe
            release/*.zip
            release/SHA256SUMS.txt
